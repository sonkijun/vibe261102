<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="storage-banner" class="banner" role="alert" hidden>
    저장 공간에 접근할 수 없어 새로고침 시 데이터가 사라질 수 있어요.
  </div>

  <main class="app">
    <header class="header">
      <h1 class="title">오늘의 할일</h1>
      <p id="today-date" class="date"></p>

      <div id="progress" class="progress" hidden>
        <div id="progress-track" class="progress-track" role="progressbar"
             aria-label="오늘 진행률" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text" class="progress-text"></span>
      </div>
      <p id="celebrate" class="celebrate" hidden>오늘 할 일을 모두 끝냈어요! 🎉</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off" novalidate>
      <label for="new-todo" class="visually-hidden">새 할 일</label>
      <input id="new-todo" class="todo-input" type="text" maxlength="200"
             placeholder="할 일을 입력하세요..." enterkeyhint="done" autofocus>
      <button type="submit" class="add-button">추가</button>
    </form>

    <section class="list-section" aria-label="할 일 목록">
      <ul id="todo-list" class="todo-list"></ul>
      <div id="empty-state" class="empty" hidden>
        <svg class="empty-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="8" y="6" width="32" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M16 18h16M16 26h16M16 34h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <p>오늘 할 일을 추가해 보세요</p>
      </div>
    </section>

    <footer id="footer" class="footer" hidden>
      <span id="remaining-count"></span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button id="toast-undo" type="button" class="toast-undo">실행 취소</button>
  </div>

  <script src="js/date.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
